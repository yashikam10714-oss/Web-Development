<!DOCTYPE html>
<html lang="en">
    <head>
        <title>
            progress bar example
        </title>
        <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    </head>

    <body>
        <div class="container">
            <h2>Basic progress bar example</h2>
            <p>To create a deflult progress bar, add a.progress class to a container element and add the progress-bar
                class to its child element. Use the CSS width property to set the width of the progress bar; 
            </p>
            <div class="progress">
                <div class="progress-bar"  style="width: 70%;">70%</div>
            </div>
        </div>
    </body>
</html>
