<!DOCTYPE html>
<html>

      <head>
         <style>
            p{
                right: 30px;
                border: 3px solid red;

            }
            p.fixed{
                position: fixed;
                top: 0;
                right: 20px;
                width: 300px;
                border: 5px solid magenta;
            }
            p.sticky {
                position: sticky;
                top: 1px;
                left: 20px;
                width: 100px;
                border: 3px solid lime;
            }

            p.absolute {
                position: relative;
                left: 100px;
                border: 3px solid black;
            }
         </style>
         <title>Positioning</title>
      </head>
    <body>
        <h2>Positioning</h2>
        <p>Div with no position property</p>
        <p class="fixed">Fixed posising</p>
        <p class="sticky">Div with sticky property</p>
        <p class="relative"> this element has position: relative;</p>
        <p class="absolute"> absolute DIV</p>
    </body>
</html>
