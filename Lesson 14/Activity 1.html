<!DOCTYPE html>
<html>

     <head>
        <title>Bootstrap Typography Example</title>
        <link rel="stylesheet"  href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
     </head>
     <body>
        <div class="container">
            <h1>Heading list example</h1>
            <h1 class="display-1">Hello</h1>
            <h1 class="display-2">Hello</h1>
            <h1 class="display-3">Hello</h1>
            <h1 class="display-4">Hello</h1>
        </div>
        <div class="container">
            <h1>Lighter, Secondary Text with Small Tag and Class Text-Muted
                <small class="Text-Muted">Hello everyone</small>
            </h1>
        </div>
     </body>
</html>
